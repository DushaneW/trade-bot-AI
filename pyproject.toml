[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum-council"
version = "0.1.0"
description = "A self-hosted council of trading bots: analysts vote, traders act on capped budgets, a lead reports to you."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["trading", "crypto", "stocks", "forex", "bots", "backtesting", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "ccxt>=4.4",
    "httpx>=0.27",
    "cryptography>=43",
    "numpy>=1.26",
    "anthropic>=2.14",
]

[project.urls]
Homepage = "https://github.com/DushaneW/trade-bot-AI"
Issues = "https://github.com/DushaneW/trade-bot-AI/issues"

[project.scripts]
quorum = "quorum.__main__:main"

[tool.setuptools]
packages = ["quorum", "quorum.bots", "quorum.connectors"]

[tool.setuptools.package-data]
quorum = ["web/*"]
