<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quorum</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app">
    <nav class="rail" id="rail" aria-label="Sections"></nav>

    <aside class="side" id="side" aria-label="Your council">
      <div class="side-top">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
          <input id="search" type="search" placeholder="Search" autocomplete="off">
        </label>
        <a class="icon-btn" href="#/new" title="New bot" aria-label="New bot">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </a>
      </div>
      <div class="side-list" id="sideList"></div>
    </aside>

    <section class="main">
      <header class="tabs" id="tabs"></header>
      <main id="view" tabindex="-1"></main>
    </section>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
