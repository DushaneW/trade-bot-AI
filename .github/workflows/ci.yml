name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check quorum tests strategies

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t quorum-council:ci .
      - name: Refuses to start without a password
        run: "! docker run --rm quorum-council:ci"
      - name: Starts and answers its health check
        run: |
          docker run -d --name quorum-ci -e QUORUM_PASSWORD=ci-only -p 8420:8420 quorum-council:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8420/api/health && exit 0; sleep 1; done
          docker logs quorum-ci
          exit 1
